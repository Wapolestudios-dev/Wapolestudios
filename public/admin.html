<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wapole Studios Admin</title><link rel="stylesheet" href="/styles.css"></head><body class="admin"><div class="admin-wrap"><div id="login"><h1>Wapole Studios Admin</h1><form id="loginForm" class="card" style="max-width:450px"><label>Username<input name="username" required></label><label>Password<input name="password" type="password" required></label><button class="btn primary">Sign in</button><p id="loginMsg"></p></form></div><div id="dashboard" hidden><div class="admin-head"><div><p class="eyebrow">ADMIN DASHBOARD</p><h1>Orders</h1></div><button id="logout" class="btn">Log out</button></div><div id="notice"></div><div id="orders"></div></div></div><script>
const $=s=>document.querySelector(s); const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])); const money=n=>"TSh "+Number(n).toLocaleString("en-US");
async function check(){const r=await fetch("/api/admin/me"); if(r.ok){$("#login").hidden=true;$("#dashboard").hidden=false;load()}else{$("#login").hidden=false;$("#dashboard").hidden=true}}
$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});const d=await r.json();if(!r.ok){$("#loginMsg").textContent=d.error;return}check()});
$("#logout").onclick=async()=>{await fetch("/api/admin/logout",{method:"POST"});location.reload()};
async function load(){const r=await fetch("/api/admin/orders");const d=await r.json();$("#orders").innerHTML=d.orders.map(o=>`<div class="admin-order"><h2>${esc(o.orderId)} <span class="status">${esc(o.orderStatus)}</span></h2><p><b>${esc(o.customerName)}</b> · ${esc(o.phone)} · ${esc(o.email)}</p><p><b>Services:</b> ${o.services.map(esc).join(", ")||"—"}<br><b>Package:</b> ${esc(o.packageName||"None")}<br><b>Total:</b> ${money(o.total)}<br><b>Payment ref:</b> ${esc(o.paymentStatus)}</p><details><summary>View full order</summary><p><b>Description:</b><br>${esc(o.description)||"—"}</p><p><b>Lyrics:</b><br>${esc(o.lyrics)||"—"}</p><p>Created: ${esc(o.createdAt)}</p></details><form class="admin-actions" enctype="multipart/form-data" data-id="${esc(o.orderId)}"><label>Status<select name="status"><option ${o.orderStatus==="Pending"?"selected":""}>Pending</option><option ${o.orderStatus==="In Progress"?"selected":""}>In Progress</option><option ${o.orderStatus==="Completed"?"selected":""}>Completed</option></select></label><label>Completed file<input type="file" name="completed"></label><button class="btn primary">Save Order</button>${o.completed?`<span>Completed file: ${esc(o.completedFileName)}</span>`:""}</form>${o.phone?`<p><a href="/api/admin/audio/${encodeURIComponent(o.orderId)}">Download client audio</a></p>`:""}</div>`).join("")||"<p>No orders yet.</p>";
document.querySelectorAll(".admin-actions").forEach(f=>f.addEventListener("submit",async e=>{e.preventDefault();const r=await fetch("/api/admin/order/"+encodeURIComponent(f.dataset.id),{method:"POST",body:new FormData(f)});const d=await r.json();$("#notice").innerHTML=`<div class="notice">${r.ok?"Order saved.":esc(d.error)}</div>`;if(r.ok)load()}))}
check();
</script></body></html>
